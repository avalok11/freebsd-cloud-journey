# =====================================================================
# PF ruleset для FreeBSD Private Cloud — версия 2.2
#
# Применяется на нодах БЕЗ jail'ов:
#   fbsd-1-sel (172.16.0.2), fbsd-2-sel (172.16.0.4), fbsd-ca-sel (172.16.0.3)
#
# Установка:
#   sudo pfctl -nf /etc/pf.conf     # только проверка синтаксиса, ruleset НЕ грузится
#   sudo pfctl -f  /etc/pf.conf     # применение
#
# Для ноды С jail'ами (fbsd-3-sel) — отдельный ruleset:
#   docs/phase-2/pf-ruleset-jails.conf (v3.1)
# Разница — блок «jails»: он ссылается на интерфейс bridge0, которого
# на перечисленных нодах нет. PF не грузит ruleset с несуществующим
# интерфейсом, поэтому один файл на обе роли не годится.
#
# Три правила, которые ломают всё:
#
#   1. ПОРЯДОК ФИЛЬТРУЮЩИХ ПРАВИЛ. PF проверяет правила сверху вниз, и
#      ПОСЛЕДНЕЕ совпавшее решает, что делать с пакетом:
#        «For block and pass, the last matching rule decides what action
#         is taken» — pf.conf(5), FreeBSD 15.1, раздел PACKET FILTERING.
#      То же самое в OpenBSD PF FAQ: «The last matching rule wins».
#      Отсюда порядок в этом файле: `block in all` (дефолт-политика) стоит
#      ВЫШЕ разрешающих правил — разрешение, которое стоит ниже, совпадёт
#      позже и перебьёт catch-all.
#      Правило с `quick` становится «последним совпавшим» сразу:
#        «If a packet matches a rule which has the quick option set, this
#         rule is considered the last matching rule, and evaluation of
#         subsequent rules is skipped» — pf.conf(5).
#      ВНИМАНИЕ: «The first matching rule decides what action is taken» —
#      это про ТРАНСЛЯЦИЮ (nat/rdr/binat), а не про фильтрацию.
#
#   2. Порядок секций в файле жёсткий (pf.conf(5)):
#      tables → options → ethernet → normalization → queueing → translation → filtering
#      pfctl проверяет это сам и откажется грузить файл с нарушением:
#      «Rules must be in order: options, ethernet, normalization, queueing,
#       translation, filtering».
#      Важно: `antispoof` — это filter-секция, поэтому он идёт ПОСЛЕ nat/rdr.
#      Исключения: `set skip` секции не принадлежит (в грамматике pfctl
#      для `set skip` проверка порядка не вызывается — parse.y,
#      `SET SKIP interface`), `table`/`macro` — тоже.
#
#   3. `table` и `macro` — единственные, чьё положение в файле не важно.
#
# История версий:
#   v1   — Фаза 0: базовый ruleset (ssh in, block in all, таблица sshguard)
#   v2   — День 3 Фазы 1: antispoof, set block-policy return, NAT-заглушка
#   v2.1 — День 3 Фазы 2: set skip на группу lo, anchor'ы Bastille
#   v2.2 — День 3 Фазы 2: исправлен порядок фильтрующих правил. В v2.1
#          разрешающие правила стояли ВЫШЕ `block in all` — при семантике
#          «последнее совпавшее решает» это ломало бы SSH: catch-all
#          совпал бы позже и перебил разрешение.
# =====================================================================

# ---- Интерфейсы -----------------------------------------------------
# ext_if: внешний интерфейс, через который нода смотрит в Selectel-сеть
ext_if  = "vtnet0"

# ---- Открытые TCP-сервисы ------------------------------------------
# В текущей фазе — только ssh. После Дня 3 Фазы 2 на fbsd-3-sel
# добавится 80/tcp (nginx в jail, отдельный ruleset v3.1).
tcp_services = "{ ssh }"

# ---- Таблицы ---------------------------------------------------------
# sshguard автоматически пишет сюда IP после N неудачных попыток.
# Файл должен существовать (sshguard создаёт его при старте):
#   /var/db/sshguard/blacklist.pf
table <sshguard> persist file "/var/db/sshguard/blacklist.pf"

# Таблица Bastille для jail'ов. Наполняется самим Bastille — но только
# для jail'ов БЕЗ VNET (см. start.sh в исходниках 1.4.4). Для VNET-jail'ов
# таблица остаётся пустой, поэтому NAT сделан по подсети, а не по таблице.
table <jails> persist

# ---- Опции -----------------------------------------------------------
# На закрытые порты отвечать TCP RST (удобнее при диагностике nmap),
# а не висеть таймаутом. Безопасности не снижает: сканер и так видит
# «port closed» за <1 сек вместо «filtered» за несколько секунд.
set block-policy return

# ---- Нормализация трафика -------------------------------------------
# Reassemble фрагментированных пакетов — защита от фрагментационных атак.
# Нормализация идёт до трансляции и фильтрации.
scrub in on $ext_if all fragment reassemble

# ---- Loopback --------------------------------------------------------
# Именно группа `lo`, а не `lo0`: Bastille на шаге `setup loopback` клонирует
# интерфейс `bastille0`, который принадлежит группе `lo`.
# Правило `set skip on lo0` его бы не покрыло.
#
# Про `set skip`: флаги skip накапливаются (набор интерфейсов), а не
# перезатираются: `set skip on lo` и `set skip on lo0` дадут объединение.
# При каждой загрузке ruleset'а флаги skip сначала сбрасываются целиком
# (pfctl_clear_interface_flags → DIOCCLRIFFLAG), потом применяются заново
# из файла.
set skip on lo

# ---- Трансляция ------------------------------------------------------
# NAT для подсети jail'ов (10.10.10.0/24 — см. architecture.md, «Bastille
# VNET»). На нодах без jail'ов правило инертно: таких адресов в сети нет.
#
# Важно: NAT именно по ПОДСЕТИ, а не по таблице <jails>. Bastille
# наполняет <jails> только для jail'ов без VNET.
nat on $ext_if from 10.10.10.0/24 to any -> ($ext_if:0)

# Anchor, который ожидает Bastille (rdr.sh проверяет его наличие).
rdr-anchor "rdr/*"

# ---- Фильтрующие правила --------------------------------------------
# Порядок: сначала терминальные блокировки (`quick`), затем дефолт-политика
# `block in all`, затем разрешения.
#
# Ключевое: разрешающее правило обязано стоять НИЖЕ `block in all`.
# Иначе catch-all совпадёт позже и перебьёт разрешение (последнее
# совпавшее правило выигрывает) — SSH просто перестанет пускать.

# 1. Заблокированные sshguard'ом — терминально, быстрый выход.
block drop in quick on $ext_if from <sshguard> to any

# 2. Антиспуфинг. Раскрывается в два правила (pf.conf(5)):
#      block drop in quick on ! $ext_if inet from 172.16.0.0/16 to any
#      block drop in quick inet from 172.16.0.5 to any
#    `quick` переносится в раскрытие — parse.y, p_antispoof: r.quick = $2.quick.
#    То есть: трафик с адресом нашей сети, пришедший не с внешнего
#    интерфейса, и трафик, подделывающий наш собственный адрес.
#    Публичный входящий трафик не затрагивается — src остаётся публичным
#    адресом клиента.
antispoof quick for $ext_if

# 3. Дефолт-политика: всё входящее по умолчанию блокируется.
#    Всё, что ниже, — явные разрешения; они совпадут позже и выиграют.
block in all

# 4. Разрешённые входящие сервисы.
pass in inet proto tcp to port $tcp_services keep state

# 5. ICMP (ping, traceroute) — для диагностики.
pass proto icmp all

# 6. Исходящий трафик — с сохранением state.
#    Обратный трафик установленных соединений идёт по state и правил
#    фильтрации не касается.
pass out all keep state

# ---- Anchor Bastille -------------------------------------------------
# Пустой anchor — правила добавляет Bastille (bastille rdr и т. п.).
# На нодах без Bastille он просто ничего не делает.
# Стоит последним: правила anchor'а попадают в разбор после основных,
# поэтому Bastille может расширить политику, а не сузить её.
anchor "bastille/*"

# ---- Защита от сканов (опционально) ---------------------------------
# Ограничить число одновременных SSH-сессий с одного IP. У нас уже есть
# sshguard, который банит после N неудачных попыток, но эта директива
# защищает ещё и от легитимного IP, который открыл 50 сессий
# (например, забытый cron-скрипт).
# Раскомментировать, если будут проблемы.
#
# ВНИМАНИЕ: такую директиву надо ставить ВЫШЕ `block in all` (или с
# `quick`) — иначе catch-all перебьёт её, и ограничение не заработает.
#
# pass in quick inet proto tcp to port ssh keep state \
#     (max-src-conn 5, max-src-conn-rate 3/60, overload <sshguard> flush global)
