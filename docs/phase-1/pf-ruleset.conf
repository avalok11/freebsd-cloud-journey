# =====================================================================
# PF ruleset для FreeBSD Private Cloud
# Применяется одинаково на fbsd-1-sel и fbsd-2-sel (Selectel, FreeBSD 15.1)
# Скопировать в /etc/pf.conf на обеих нодах
#
# История версий:
#   v1 — Фаза 0, базовый ruleset (ssh in, block in all, sshguard table)
#   v2 — День 3 Фазы 1: добавлен antispoof, NAT-заглушка под jails (Фаза 2)
# =====================================================================

# ---- Интерфейсы -----------------------------------------------------
# ext_if: внешний интерфейс, через который нода смотрит в Selectel-сеть
# lo_if: loopback, всегда доверяем
ext_if  = "vtnet0"
lo_if   = "lo0"

# ---- Открытые TCP-сервисы ------------------------------------------
# В текущей фазе — только ssh. После Фазы 2 добавим 80/443 (nginx в jail)
tcp_services = "{ ssh }"

# ---- Таблица заблокированных IP -------------------------------------
# sshguard автоматически пишет сюда IP после N неудачных попыток
# Файл должен существовать (sshguard создаёт при старте):
#   /var/db/sshguard/blacklist.pf
table <sshguard> persist file "/var/db/sshguard/blacklist.pf"

# ---- Общие настройки -----------------------------------------------
# На закрытые порты отвечать TCP RST (удобнее при диагностике nmap),
# а не висеть таймаутом. Безопасности не снижает: сканер и так видит
# «port closed» за <1 сек вместо «filtered» за несколько секунд.
set block-policy return

# ---- Нормализация трафика -------------------------------------------
# Reassemble фрагментированных пакетов — защита от фрагментационных атак
scrub in on $ext_if all fragment reassemble

# ---- Loopback -------------------------------------------------------
set skip on $lo_if

# ---- Антиспуфинг (v2) ----------------------------------------------
# Отбрасывать пакеты, у которых src IP не принадлежит нашему интерфейсу
# (например, с src=127.0.0.1 или с чужим публичным IP, пришедший изнутри)
antispoof quick for $ext_if

# ---- Блокировки -----------------------------------------------------
# Сначала — заблокированные sshguard'ом (быстрый путь до основных правил)
block drop in quick on $ext_if from <sshguard> to any

# Дефолт-политика: всё, что не разрешено явно — блокируем
block in all

# Разрешаем исходящий трафик с сохранением state
pass out all keep state

# ---- Входящие сервисы ----------------------------------------------
# SSH
pass in inet proto tcp to port $tcp_services keep state

# ICMP (ping, traceroute) — для диагностики
pass proto icmp all

# ---- NAT (закомментировано, активируем в Фазе 2) -------------------
# Когда поднимем jails (Bastille) на fbsd-1-sel, jail-ы получат IP из
# 10.10.10.0/24 (см. architecture.md, сеть Bastille VNET), и им нужен
# будет выход в интернет через ext_if. Раскомментировать и поправить
# jailnet на актуальный диапазон.
#
# table <jailnet> persist { 10.10.10.0/24 }
# nat on $ext_if from <jailnet> to any -> ($ext_if)
#
# После активации NAT не забыть:
#   pass in on $ext_if proto tcp from any to ($ext_if) port 80  rdr-to <nginx-jail-ip>
#   pass in on $ext_if proto tcp from any to ($ext_if) port 443 rdr-to <nginx-jail-ip>

# ---- Защита от сканов (опционально, v2) ----------------------------
# Ограничить число одновременных SSH-сессий с одного IP. У нас уже есть
# sshguard, который банит после N неудачных попыток, но эта директива
# защищает ещё и от легитимного IP, который открыл 50 сессий
# (например, забытый cron-скрипт).
# Раскомментировать, если будут проблемы.
#
# pass in inet proto tcp to port ssh keep state \
#     (max-src-conn 5, max-src-conn-rate 3/60, overload <sshguard> flush global)
