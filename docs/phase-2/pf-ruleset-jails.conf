# =====================================================================
# PF ruleset для fbsd-3-sel — версия 3.1 (jails / Bastille)
#
# Применяется ТОЛЬКО на fbsd-3-sel (172.16.0.5) — единственной ноде
# с jail'ами. Остальные ноды используют docs/phase-1/pf-ruleset.conf (v2.2).
#
# Установка:
#   sudo pfctl -nf /etc/pf.conf     # только проверка синтаксиса, ruleset НЕ грузится
#   sudo pfctl -f  /etc/pf.conf     # применение
#
# Отличия v3.1 от v3:
#   1. Исправлен порядок фильтрующих правил: `block in all` стоит ВЫШЕ
#      разрешающих правил, а не ниже (см. «Порядок обработки» ниже).
#   2. Добавлено отдельное правило для трафика jail → шлюз (10.10.10.1):
#      в v3 правило `to ! $jail_net` отсекало и шлюз, и ping до него не проходил.
#
# Порядок секций в файле жёсткий (pf.conf(5)):
#   tables → options → ethernet → normalization → queueing → translation → filtering
# pfctl проверяет это сам и откажется грузить файл с нарушением:
#   «Rules must be in order: options, ethernet, normalization, queueing,
#    translation, filtering».
# `antispoof` — filter-секция, поэтому идёт ПОСЛЕ nat/rdr.
# `set skip` секции не принадлежит: в грамматике pfctl для `set skip`
# проверка порядка не вызывается (parse.y, `SET SKIP interface`).
# `table`/`macro` — тоже.
#
# Порядок обработки (главное в этом файле):
#   PF проверяет правила сверху вниз, и ПОСЛЕДНЕЕ совпавшее решает, что
#   делать с пакетом — «For block and pass, the last matching rule decides
#   what action is taken» (pf.conf(5), FreeBSD 15.1, PACKET FILTERING).
#   То же в OpenBSD PF FAQ: «The last matching rule wins».
#   Правило с `quick` становится последним совпавшим сразу и завершает
#   разбор: «this rule is considered the last matching rule, and evaluation
#   of subsequent rules is skipped» (pf.conf(5)).
#   Отсюда: `block in all` стоит ВЫШЕ разрешений, иначе catch-all совпадёт
#   позже и перебьёт их.
#   «The first matching rule decides what action is taken» — это про
#   ТРАНСЛЯЦИЮ (nat/rdr/binat), а не про фильтрацию.
# =====================================================================

# ---- Интерфейсы -----------------------------------------------------
# ext_if: физический интерфейс ноды (172.16.0.5/16), выход в интернет
ext_if  = "vtnet0"

# jail_if: L2-мост, в котором живут epair'ы jail'ов. На самом мосте —
#          адрес шлюза jail'ов (10.10.10.1/24). Физического интерфейса
#          в мосте нет: трафик jail'ов идёт через маршрутизацию ноды,
#          а не через L2-бридж — иначе он миновал бы PF.
# jail_net: адресация jail'ов (architecture.md, сеть «Bastille VNET»)
# jail_gw: адрес шлюза jail'ов на мосте — к нему jail'ы обращаются напрямую
jail_if  = "bridge0"
jail_net = "10.10.10.0/24"
jail_gw  = "10.10.10.1"

# ---- Открытые TCP-сервисы ------------------------------------------
# ssh — на саму ноду; 80/tcp — проброс в jail с nginx (см. rdr ниже).
tcp_services = "{ ssh }"

# ---- Таблицы ---------------------------------------------------------
# sshguard автоматически пишет сюда IP после N неудачных попыток.
# Файл должен существовать (sshguard создаёт его при старте):
#   /var/db/sshguard/blacklist.pf
table <sshguard> persist file "/var/db/sshguard/blacklist.pf"

# Таблица Bastille. Наполняется Bastille только для jail'ов БЕЗ VNET;
# для нашего VNET-jail'а она остаётся пустой — поэтому NAT ниже сделан
# по подсети, а не по таблице.
table <jails> persist

# ---- Опции -----------------------------------------------------------
# На закрытые порты отвечать TCP RST, а не висеть таймаутом.
set block-policy return

# ---- Нормализация трафика -------------------------------------------
# Reassemble фрагментированных пакетов — защита от фрагментационных атак.
scrub in on $ext_if all fragment reassemble

# ---- Loopback --------------------------------------------------------
# Группа `lo`, а не `lo0`: Bastille на шаге `setup loopback` клонирует
# интерфейс `bastille0`, который принадлежит группе `lo`.
# Флаги skip накапливаются (набор интерфейсов), а не перезатираются.
set skip on lo

# ---- Трансляция ------------------------------------------------------
# NAT для подсети jail'ов. Именно по подсети: Bastille наполняет
# таблицу <jails> только для jail'ов без VNET (start.sh, исходники 1.4.4).
nat on $ext_if from $jail_net to any -> ($ext_if:0)

# Проброс 80/tcp в jail `web` (10.10.10.10).
rdr on $ext_if proto tcp to port 80 -> 10.10.10.10 port 80

# Anchor, который ожидает Bastille (rdr.sh проверяет его наличие).
rdr-anchor "rdr/*"

# ---- Фильтрующие правила --------------------------------------------
# Порядок: сначала терминальные блокировки (`quick`), затем дефолт-политика
# `block in all`, затем разрешения.
#
# Ключевое: разрешающее правило обязано стоять НИЖЕ `block in all`.
# Иначе catch-all совпадёт позже и перебьёт разрешение (последнее
# совпавшее правило выигрывает) — SSH просто перестанет пускать.

# 1. Заблокированные sshguard'ом — терминально, быстрый путь до основных правил.
block drop in quick on $ext_if from <sshguard> to any

# 2. Антиспуфинг. Раскрывается в:
#      block drop in quick on ! $ext_if inet from 172.16.0.0/16 to any
#      block drop in quick inet from 172.16.0.5 to any
#    Трафик jail'ов не затрагивается: у него src из 10.10.10.0/24.
antispoof quick for $ext_if

# 3. Дефолт-политика: всё входящее по умолчанию блокируется.
#    Всё, что ниже, — явные разрешения; они совпадут позже и выиграют.
block in all

# 4. Трафик jail'ов к шлюзу — отдельно: адрес шлюза лежит ВНУТРИ $jail_net,
#    поэтому правило «куда угодно, кроме подсети jail'ов» его не покрывает.
pass in on $jail_if from $jail_net to $jail_gw keep state

# 5. Трафик jail'ов наружу (и НЕ к другим jail'ам).
#    Ограничение `to ! $jail_net` отсекает трафик jail → jail:
#    второй jail появится на Дне 6.
pass in on $jail_if from $jail_net to ! $jail_net keep state

# 6. Входящие сервисы ноды.
pass in inet proto tcp to port $tcp_services keep state

# 7. Проброс в jail: после rdr-трансляции dst = 10.10.10.10:80.
pass in on $ext_if proto tcp from any to 10.10.10.10 port 80 keep state

# 8. ICMP (ping, traceroute) — для диагностики.
pass proto icmp all

# 9. Исходящий трафик — с сохранением state. Сюда же попадает
#    форвардинг трафика jail'ов наружу (маршрутизирует нода).
#    Обратный трафик установленных соединений идёт по state.
pass out all keep state

# ---- Anchor Bastille -------------------------------------------------
# Пустой anchor — правила добавляет Bastille.
# Стоит последним: правила anchor'а попадают в разбор после основных.
anchor "bastille/*"
