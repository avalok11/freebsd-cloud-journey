hostname="fbsd-3-sel.lab.sel"
ifconfig_vtnet0="inet 172.16.0.5 netmask 255.255.0.0"
defaultrouter="172.16.0.1"
sshd_enable="YES"
ntpd_enable="YES"
ntpd_sync_on_start="YES"
moused_nondefault_enable="NO"
# Set dumpdev to "AUTO" to enable crash dumps, "NO" to disable
dumpdev="AUTO"
zfs_enable="YES"
sshguard_enable="YES"
pf_enable="YES"

