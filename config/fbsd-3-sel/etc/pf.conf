set ruleset-optimization none
# === basic variable ===
ext_if = "vtnet0"
tcp_service = "ssh"
# === table fro blocked IPs ===
table <sshguard> persist file "/var/db/sshguard/blacklist.pf"
# === normalisation traffics ===
scrub in on $ext_if all fragment reassemble
# === Loopback is always permited ===
set skip on lo0
# === blocking from sshguard table
block drop in quick on $ext_if from <sshguard> to any label "sshguard-drop"
# === basic rules ===
block in all label "block-any"
pass out all keep state label "allow-out"
# == SSH is allowed ===
pass in inet proto tcp to port $tcp_service keep state label "allow SSH"
# === ICMP is allowed ===
pass inet proto icmp all label "allo ICMP"
